<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>








</head>


<style>

/*BUTTON RITORN*/

back-home-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:14px 26px;
  background:linear-gradient(135deg, #0b2545, #133c73);
  color:white;
  text-decoration:none;
  border-radius:14px;
  font-size:16px;
  font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
  transition:all 0.3s ease;
  margin-bottom:30px;
}

.back-home-btn span{
  font-size:20px;
  transition:transform 0.3s ease;
}

.back-home-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 12px 25px rgba(0,0,0,0.35);
}

.back-home-btn:hover span{
  transform:translateX(-4px);
}

    .quote-section{
  padding:40px;
  background:#0b2545;
  border-radius:20px;
  margin-top:40px;
}

.quote-section h2{
  color:white;
  margin-bottom:20px;
  text-align:center;
}

.quote-form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.quote-form input,
.quote-form select,
.quote-form textarea{
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.quote-form textarea{
  min-height:180px;
  resize:vertical;
}

.quote-form button{
  padding:15px;
  border:none;
  border-radius:10px;
  background:royalblue;
  color:white;
  font-size:18px;
  cursor:pointer;
}



.upload-info{
  color:#ccc;
  font-size:14px;
  text-align:center;
  margin-top:10px;
}

.whatsapp-btn{
  display:block;
  text-align:center;
  background:#25D366;
  color:white;
  padding:14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  margin-top:15px;
  transition:0.3s;
}

.whatsapp-btn:hover{
  transform:scale(1.02);
}
body{
  font-family: 'Poppins', sans-serif;
}


</style>
<body>
    



  <section class="quote-section">
<a href="index.html">
  <button 
    style="
      background:#113769;
      color:white;
      border:none;
      padding:14px 28px;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    ">
    Ritorna alla Home
  </button>
</a>

    


  <h2 data-lang="quote_title">
    Richiedi un Preventivo
  </h2>

  <form
    action="https://formspree.io/f/xgodyrqq"
    method="POST"
    enctype="multipart/form-data"
    class="quote-form"
  >

    <input
      type="text"
      name="nome"
      placeholder="Nome completo"
      required
    >

    <input
      type="tel"
      name="telefono"
      placeholder="Telefono"
      required
    >

    <input
      type="email"
      name="email"
      placeholder="Email"
      required
    >

    <select name="servizio" required>
      <option value="">Seleziona il servizio</option>
      <option>Sito Vetrina</option>
      <option>Sito Dinamico</option>
      <option>E-commerce</option>
      <option>Landing Page</option>
      <option>Altro</option>
    </select>

    <textarea
      name="idea"
      maxlength="4500"
      placeholder="Descrivi la tua idea..."
      required
    ></textarea>
<!--WHARSAPP-->

<p class="upload-info">
  Se hai file o immagini, inviali via WhatsApp o email.
</p>

<a
  href="https://wa.me/573103875988"
  target="_blank"
  class="whatsapp-btn"
>
  Invia File su WhatsApp
</a>
    

    <button type="submit">
      Invia Preventivo
    </button>

  </form>
          

</section>


























<script src="java.js"></script>

</body>
</html>
