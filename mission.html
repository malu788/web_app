    /*PAGINA MISION INDEX*/
    /* 🔥 CONTENITORE 3D */
.card-3d {
  width: 300px;
  margin: 40px auto;
  perspective: 1000px;
}

/* 🔥 IMMAGINE */
.card-3d img {
  width: 100%;
  border-radius: 15px;
  transition: transform 0.2s;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}



























/* 🔥 TESTO SOPRA */
.card-3d .info {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 10px;
}
/* 🔥 CONTENUTO CENTRATO */
.container {
  padding-top: 100px;
}

/* 🔥 BOTTONE */
.btn {
  margin-top: 20px;
  padding: 12px 20px;
  background: #7d9aa5;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* 💎 VETRO */
.glass {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 40px;
  width: 80%;
  max-width: 500px;
  text-align: center;

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);

  transition: transform 0.2s ease;
}




  </style>
